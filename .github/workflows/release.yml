name: Publish Release

# Manual version-tag pushes also publish a release. Pushes to main are versioned
# and released by the CI workflow after its checks and Windows build succeed.
on:
  push:
    tags:
      - "v*.*.*"

# We need write permissions to automatically create a GitHub Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" --name "NinjaCollector" main.py

      - name: Zip the Build
        run: |
          # Compress the build folder so it's a single downloadable file
          Compress-Archive -Path dist/NinjaCollector/* -DestinationPath NinjaCollector-Windows.zip

      - name: Generate Checksum
        run: |
          $hash = Get-FileHash -Path NinjaCollector-Windows.zip -Algorithm SHA256
          $hash.Hash + "  NinjaCollector-Windows.zip" | Out-File -Encoding ASCII NinjaCollector-Windows.zip.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            NinjaCollector-Windows.zip
            NinjaCollector-Windows.zip.sha256
          generate_release_notes: true
