name: Publish Release

# Manual version-tag pushes also publish a release. Pushes to main are versioned
# and released by the CI workflow after its checks and Windows build succeed.
on:
  push:
    tags:
      - "v*.*.*"

# We need write permissions to automatically create a GitHub Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" --name "NinjaCollector" main.py

      - name: Zip the Build
        run: |
          # Compress the build folder so it's a single downloadable file
          Compress-Archive -Path dist/NinjaCollector/* -DestinationPath NinjaCollector-Windows.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NinjaCollector-Windows.zip
          generate_release_notes: true
