name: Continuous Integration

# This triggers the workflow on any push or pull request to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repository
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Step 3: Install the requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Ruff to check code quality and syntax
      - name: Lint with Ruff
        run: ruff check .

      # Step 5: Check for known security vulnerabilities
      - name: Run pip-audit
        run: pip-audit

      # Step 6: Run tests and generate coverage
      - name: Run Tests and Generate Coverage
        run: |
          mkdir -p reports
          python -m pytest --cov=src --cov-report=term-missing --cov-report=json:reports/coverage.json --junitxml=reports/junit.xml
          python scripts/generate_coverage_md.py

      # Step 7: Upload Coverage Reports
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: |
            reports/coverage.md
            reports/coverage.json
            reports/junit.xml

  build-windows:
    runs-on: windows-latest
    needs: build-and-test # This ensures we only build if the code passes tests/linting!

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # The --windowed flag prevents the black command prompt from showing up
          # The --add-data flag tells it to bundle your assets/ folder into the .exe
          pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" --name "NinjaCollector" main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NinjaCollector-Windows-Build
          path: dist/NinjaCollector/

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next patch tag
        id: version
        shell: bash
        run: |
          for attempt in {1..5}; do
            tags=$(git ls-remote --tags --refs origin 'refs/tags/v*' | cut -f2 | sed 's#refs/tags/##')
            latest_tag=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            version="${latest_tag#v}"
            if [[ -z "$latest_tag" ]]; then
              version="0.0.0"
            fi
            IFS='.' read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"

            if git push origin "${GITHUB_SHA}:refs/tags/${next_tag}"; then
              echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $next_tag could not be created; retrying ($attempt/5)." >&2
            sleep 1
          done

          echo "Failed to create a unique patch tag after 5 attempts." >&2
          exit 1

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: NinjaCollector-Windows-Build
          path: release-files

      - name: Package Windows build
        run: |
          cd release-files
          zip -r ../NinjaCollector-Windows.zip .

      - name: Create version tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: NinjaCollector-Windows.zip
          generate_release_notes: true