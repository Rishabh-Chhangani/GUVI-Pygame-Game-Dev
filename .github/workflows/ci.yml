name: Continuous Integration

# This triggers the workflow on any push or pull request to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Step 3: Install the requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Ruff to check code quality and syntax
      - name: Lint with Ruff
        run: ruff check .

      # Step 5: Check for known security vulnerabilities
      - name: Run pip-audit
        run: pip-audit

  build-windows:
    runs-on: windows-latest
    needs: build-and-test # This ensures we only build if the code passes tests/linting!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # The --windowed flag prevents the black command prompt from showing up
          # The --add-data flag tells it to bundle your assets/ folder into the .exe
          pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" --name "NinjaCollector" main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinjaCollector-Windows-Build
          path: dist/NinjaCollector/